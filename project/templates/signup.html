<!DOCTYPE html>
<html>
<head>
    <title>Signup - VAS PRO</title>
</head>
<body>
    <h1>Регистрация в VAS PRO</h1>
    {% if messages %}
        {% for message in messages %}
            <p style = "color: red;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Име" required><br>
        <input type="email" name="email" placeholder="Имейл" required><br>
        <input type="password" name="password" placeholder="Парола" required><br>
        <input type="password" name="password2" placeholder="Потвърдете паролата" required><br>
        <button type="submit">Регистрация</button>
    </form>
    <p>Вече имаш акаунт? <a href="{% url 'login' %}">Вход</a></p>
</body>
</html>
