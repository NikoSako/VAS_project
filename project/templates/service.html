<!DOCTYPE html>
<html>
<head>
    <title>Order Details - VAS PRO</title>
</head>
<body>
<h2>Заяви услуга</h2>

<form method="post" id="order-form">
    {% csrf_token %}

    <div>
        <select name="is_gutter" id="id_is_gutter">
            <option value="True">Улуци</option>
            <option value="False">Водосточни тръби</option>
        </select>
    </div>

    <div>
        <label for="{{ form.colour_type.id_for_label }}">Тип алуминий:</label>
        {{ form.colour_type }}
    </div>

    <div>
        <div id="ral-code-container" style="display:none;"></div>
        <label for="{{ form.ral_code.id_for_label }}">RAL код:</label>
        {{ form.ral_code }}
    </div>

    <div>
        <label for="{{ form.size.id_for_label }}">Размер:</label>
        {{ form.size }}
    </div>

    <div>
        <label for="{{ form.length_m.id_for_label }}">Дължина (в метри):</label>
        {{ form.length_m }}
    </div>

    <hr>

    <h3>Ъгли:</h3>
    <div id="angles-container">
    </div>

    <hr>

    <button type="submit">Изпрати</button>
</form>

<script>
    const angleOptions = {
        gutter: [
            ['gutter_inner_90', 'Вътрешен ъгъл 90°'],
            ['gutter_outer_90', 'Външен ъгъл 90°']
        ],
        pipe: [
            ['pipe_45', 'Кривка 45°'],
            ['pipe_72', 'Кривка 72°'],
            ['pipe_90', 'Кривка 90°']
        ]
    };

    function updateRALVisibility() {
        const colourType = document.getElementById("id_colour_type");
        const ralContainer = document.getElementById("ral-code-container");
        if (colourType.value === "RAL") {
            ralContainer.style.display = "block";
        } else {
            ralContainer.style.display = "none";
            document.getElementById("id_ral_code").value = "";
        }
    }

    function updateAngles() {
        const isGutter = document.getElementById("id_is_gutter").value === "True";
        const container = document.getElementById("angles-container");

        container.innerHTML = "";

        const selectedAngles = isGutter ? angleOptions.gutter : angleOptions.pipe;

        selectedAngles.forEach((angle, index) => {
            const [angleType, label] = angle;

            const div = document.createElement("div");

            const hiddenInput = document.createElement("input");
            hiddenInput.type = "hidden";
            hiddenInput.name = `angle_${index + 1}_type`;
            hiddenInput.value = angleType;

            const quantityInput = document.createElement("input");
            quantityInput.type = "number";
            quantityInput.name = `angle_${index + 1}_quantity`;
            quantityInput.min = 0;
            quantityInput.value = 0;

            const labelEl = document.createElement("label");
            labelEl.innerText = label + ": ";
            labelEl.appendChild(quantityInput);

            div.appendChild(hiddenInput);
            div.appendChild(labelEl);

            container.appendChild(div);
        });
    }

    function updateSizeOptions() {
        const isGutter = document.getElementById("id_is_gutter").value === "True";
        const sizeSelect = document.getElementById("id_size");

        sizeSelect.innerHTML = "";
        
        if (isGutter) {
            addOption(sizeSelect, "5", '5"');
            addOption(sizeSelect, "6", '6"');
        } else {
            addOption(sizeSelect, "80", 'Ф80');
            addOption(sizeSelect, "100", 'Ф100');
        }
    }

    function addOption(selectElement, value, text) {
        const option = document.createElement("option");
        option.value = value;
        option.text = text;
        selectElement.appendChild(option);
    }

    document.getElementById("id_colour_type").addEventListener("change", updateRALVisibility);
    document.getElementById("id_is_gutter").addEventListener("change", function() {
        updateAngles();
        updateSizeOptions();
    });

    updateRALVisibility();
    updateAngles();
    updateSizeOptions();
</script>
</body>
</html>
